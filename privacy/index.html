<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy Directory - Zypher</title>
  <link rel="icon" type="image/png" href="../assets/puzzles_icon.png">
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #a855f7;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.6;
      padding: 0 1.5rem 4rem 1.5rem;
    }
    .container { max-width: 860px; margin: 0 auto; }
    header {
      padding: 3rem 0 2rem 0;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 2.5rem;
    }
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    p { color: #c9d1d9; margin-bottom: 1.5rem; }
    .policy-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 3rem;
    }
    .policy-item {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .policy-item:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .policy-info { display: flex; align-items: center; gap: 1rem; }
    .policy-icon { width: 48px; height: 48px; border-radius: 10px; }
    .policy-name { font-size: 1.1rem; font-weight: 600; }
    .policy-id { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
    .chevron { color: var(--text-muted); font-size: 1.2rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../" class="back-link">&larr; Back to Portal Home</a>
      <h1>Privacy Policy Directory</h1>
      <p>Select an application to view its specific Google Play and store-compliant privacy policy.</p>
    </header>

    <div class="policy-list">
      <a href="puzzles/" class="policy-item">
        <div class="policy-info">
          <img src="../assets/puzzles_icon.png" alt="Zypher Puzzles" class="policy-icon">
          <div>
            <div class="policy-name">Zypher Puzzles</div>
            <div class="policy-id">com.zypher.puzzlegame &bull; Updated Sep 12, 2026</div>
          </div>
        </div>
        <div class="chevron">&rarr;</div>
      </a>
    </div>
  </div>
</body>
</html>
